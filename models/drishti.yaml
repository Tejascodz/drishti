# Template for your own models. The defaults already use Drishti's trained plate detector
# (downloaded from this repo's releases) and the public OCR, so this file is only needed
# to swap in local ONNX files:
#   drishti --config models/drishti.yaml image photos/
models:
  plate_detector: drishti-yolo26s-in-960          # or a path, e.g. models/my_detector.onnx
  ocr: cct-s-v2-global-model                      # or a path to a fine-tuned slot OCR:
  ocr_config: null                                #   ocr: models/ocr_in/best.onnx
                                                  #   ocr_config: models/ocr_in/best_plate_config.yaml
